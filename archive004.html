<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第七观测站 · 档案004</title>
<style>
  body { margin: 0; padding: 0; background: #1a1a1a; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #d4c5a9; }
  .container { max-width: 600px; width: 90%; background: url('paper.jpg') center/cover; padding: 40px; border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,0.8); position: relative; }
  .container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); border-radius: 4px; pointer-events: none; }
  h1 { font-size: 18px; letter-spacing: 4px; color: #8b7355; margin-bottom: 20px; text-align: center; position: relative; z-index: 1; }
  .rule-list { font-size: 14px; line-height: 2.2; color: #c4b59a; margin-bottom: 30px; padding-left: 20px; position: relative; z-index: 1; }
  .rule-list p { margin: 0 0 10px 0; cursor: pointer; transition: all 0.3s; }
  .rule-list p:hover { background: #3a3025; }
  .rule-7 { font-family: 'KaiTi', '楷体', serif; color: #8b7355; font-style: italic; } /* 第七条字体不一样 */
  .tip { font-size: 13px; color: #8b7355; margin-top: 20px; text-align: center; letter-spacing: 2px; position: relative; z-index: 1; }
  .hidden { display: none; }
  .unlocked { text-align: center; padding: 40px 0; position: relative; z-index: 1; }
  .unlocked h2 { color: #8b7355; font-size: 16px; letter-spacing: 4px; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="container" id="main">
  <h1>档案 004 · 观测守则（手抄）</h1>
  
  <div class="rule-list">
    <p onclick="wrongClick()">一、每日06:00、14:00、22:00准时观测。</p >
    <p onclick="wrongClick()">二、云量超过9成时，不要直视窗外。</p >
    <p onclick="wrongClick()">三、如果风速仪显示0，请立即离开观测室。</p >
    <p onclick="wrongClick()">四、收到89.7频率时，记录，不要回应。</p >
    <p onclick="wrongClick()">五、如果听见有人叫你的名字，不要答应。</p >
    <p onclick="wrongClick()">六、每日记录必须手写。</p >
    <p class="rule-7" onclick="correctClick()">七、1998年7月12日之后，不要相信任何显示“晴”的记录。</p >
  </div>

  <div class="tip" id="tip">提示：仔细看看第七条，字迹和前面不一样。</div>
</div>

<div class="container hidden" id="unlocked">
  <div class="unlocked">
    <h2>档案 005 已解锁</h2>
    <p>最后一封电报（1998）</p >
    <p style="font-size:12px;color:#6b5b45;margin-top:20px;">正在跳转……</p >
  </div>
</div>

<script>
function wrongClick() {
  var tip = document.getElementById('tip');
  tip.innerText = '这只是普通的守则。看看第七条。';
  tip.style.color = '#8b3a3a';
  setTimeout(function(){ tip.innerText = '提示：仔细看看第七条，字迹和前面不一样。'; tip.style.color = '#8b7355'; }, 2000);
}

function correctClick() {
  var main = document.getElementById('main');
  var unlocked = document.getElementById('unlocked');
  var tip = document.getElementById('tip');

  tip.innerText = '你翻开第七条背面，上面写着：“89.7不是频率，是日期。”';
  tip.style.color = '#8b7355';

  main.classList.add('hidden');
  unlocked.classList.remove('hidden');
  
  // 等待3秒后，自动跳转到档案005
  setTimeout(function() {
    window.location.href = './archive005.html';
  }, 3000);
}
</script>

</body>
</html>
